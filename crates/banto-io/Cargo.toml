[package]
name = "banto-io"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "banto's outside world: session discovery, sqlite store, PTY hosting, watchers"

[dependencies]
anyhow = "1.0.104"
banto-core = { version = "0.1.0", path = "../banto-core" }
dirs = "6.0.0"
notify = "8.2.0"
portable-pty = { version = "0.9.6", package = "portable-pty-psmux" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.19"
toml = "0.9.8"

[target.'cfg(unix)'.dependencies]
# Only for `killpg(SIGHUP)` in `pty::Hangup` — a Unix pty hangs up when the
# *last* fd on its master closes, which dropping banto's own copies cannot
# guarantee (see that trait's doc).
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.24.0"
