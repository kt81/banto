[package]
name = "banto"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "A resident TUI that searches, groups, and resumes Claude Code sessions — and hosts them as embedded panes"

[dependencies]
anyhow = "1.0.104"
banto-core = { version = "0.1.0", path = "../banto-core" }
banto-io = { version = "0.1.0", path = "../banto-io" }
banto-tui = { version = "0.1.0", path = "../banto-tui" }
clap = { version = "4.6.2", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.2"
serde_json = "1.0.150"
thiserror = "2.0.19"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[dev-dependencies]
tempfile = "3"
