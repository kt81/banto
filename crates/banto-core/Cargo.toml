[package]
name = "banto-core"
version = "0.1.0"
edition = "2024"

[dependencies]
nucleo = "0.5.0"
# `ratatui-core`, not the umbrella `ratatui` crate: `ratatui` defaults to its
# `crossterm` feature (a terminal backend, transitively pulling in the real
# `crossterm` crate), which this crate must never depend on
# (`docs/DISCIPLINE.md` §2). `ratatui-core` is the pure layout/buffer/style
# foundation the ratatui project itself splits out for exactly this case —
# only `layout::{Rect, Layout, Constraint, Position}`'s pure geometry math
# is used here (the emporium's pane-tiling), no rendering.
ratatui-core = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
vt100 = "0.16.2"

[dev-dependencies]
toml = "0.9.8"
