[workspace]
resolver = "3"
members = ["crates/banto-core", "crates/banto-io", "crates/banto-tui", "crates/banto"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kt81/banto"

[profile.release]
lto = "thin"
strip = true

# Keep banto's own dev code easy to debug, while making dependency-heavy
# runtime work (notably serde_json parsing) representative enough to use.
[profile.dev.package."*"]
opt-level = 2

# crossterm 0.29.0's Windows input parser feeds surrogate KEY-UP halves into
# its pairing logic, so anything injected via KEYEVENTF_UNICODE (the Windows
# emoji panel, notably) pairs as (high, high)/(low, low) and vanishes —
# diagnosed with a raw ReadConsoleInputW probe, 2026-07-25. Upstream releases
# are infrequent, so banto rides a pinned one-commit fork of the 0.29 tag
# (fix also PR'd upstream; drop this patch when a release carries it).
[patch.crates-io]
crossterm = { git = "https://github.com/kt81/crossterm", branch = "banto/0.29-emoji-panel-fix" }
# vt100 measures cell width one character at a time, so a base char followed
# by U+FE0F settles as one narrow cell while every terminal — and the child
# driving this grid — counts the pair as two columns. The grid then sits a
# column short of what the child believes, and anything it repositions to
# lands one cell off, leaving the skipped cell holding the previous frame
# (measured 2026-08-03 on Claude Code's status line: a ten-cell bar drawn as
# eleven). Upstream doy/vt100-rust has been unmaintained since 2025-07 and
# the fix has sat in its PR #32 since 2026-05. The pinned commit also fixes
# an orphaned-wide-cell panic in Row::erase/resize. The published
# vt100-psmux carries both since 0.16.10, but moving to 0.16.13 was tried
# and backed out on 2026-11-16. It counts thumbs-up with a skin tone
# (U+1F44D U+1F3FD) and the flag U+1F1EF U+1F1F5 as one two-cell cluster
# each. A pane's PTY stream captured on Windows that day moved the cursor
# past each as if it took four cells, assuming the label after it was
# meant to stay aligned, and the thumbs-up row was drawn with the spaces
# after its emoji gone. This fork counts the thumbs-up as four cells and
# the flag as two. Which layer, the agent or ConPTY, chose those moves is
# not established. Fold back only once the published widths agree with
# what panes send here. The pinned commit never bumps its own version past
# 0.16.9, and the manifests require ^0.16.9, so dropping this patch alone
# lets cargo resolve any published 0.16.x from 0.16.9 up, the unfixed
# 0.16.9 among them, with nothing in the version number to tell them apart.
vt100-psmux = { git = "https://github.com/kt81/psmux", branch = "banto/vt100-patches" }
